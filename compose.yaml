services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research}
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research} -d ${POSTGRES_DB:-research}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-research}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-research-minio-dev}
      MINIO_BROWSER: "on"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://research:research-dev@postgres:5432/research}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: .
    ports:
      # Bind only to this machine's Tailscale address, not LAN/public interfaces.
      - "${TAILSCALE_IP:?Set TAILSCALE_IP in .env}:${API_PORT:-3333}:8000"
    environment:
      # Internal URL that the API can use when PDF parsing is added.
      GROBID_URL: http://grobid:8070
      GROBID_FALLBACK_FLAVOR: ${GROBID_FALLBACK_FLAVOR:-article/light-ref}
      OCR_ENABLED: ${OCR_ENABLED:-1}
      EXTRACTION_ARTIFACT_PATH: /data/extractions
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-research}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-research-minio-dev}
      S3_BUCKET: ${S3_BUCKET:-research-papers}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-0}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://research:research-dev@postgres:5432/research}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
      CLAIM_AUDIT_MODEL: ${CLAIM_AUDIT_MODEL:-gpt-5.4-nano}
      CLAIM_AUDIT_REVIEW_MODEL: ${CLAIM_AUDIT_REVIEW_MODEL:-gpt-5.4-mini}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_CACHE_PATH: /data/openalex-cache.jsonl
      OPENALEX_PROXY: ${OPENALEX_PROXY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      SEMANTIC_SCHOLAR_URL: ${SEMANTIC_SCHOLAR_URL:-https://api.semanticscholar.org/graph/v1}
    volumes:
      - openalex-cache:/data
    depends_on:
      grobid:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/hello')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["python", "-m", "app.workers.main"]
    environment:
      GROBID_URL: http://grobid:8070
      GROBID_FALLBACK_FLAVOR: ${GROBID_FALLBACK_FLAVOR:-article/light-ref}
      OCR_ENABLED: ${OCR_ENABLED:-1}
      EXTRACTION_ARTIFACT_PATH: /data/extractions
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://research:research-dev@postgres:5432/research}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-research}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-research-minio-dev}
      S3_BUCKET: ${S3_BUCKET:-research-papers}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CLAIM_AUDIT_MODEL: ${CLAIM_AUDIT_MODEL:-gpt-5.4-nano}
      CLAIM_AUDIT_REVIEW_MODEL: ${CLAIM_AUDIT_REVIEW_MODEL:-gpt-5.4-mini}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      OPENALEX_CACHE_PATH: /data/openalex-cache.jsonl
      OPENALEX_PROXY: ${OPENALEX_PROXY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      SEMANTIC_SCHOLAR_URL: ${SEMANTIC_SCHOLAR_URL:-https://api.semanticscholar.org/graph/v1}
    volumes:
      - openalex-cache:/data
    depends_on:
      grobid:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - backend
    restart: unless-stopped

  grobid:
    # Full uses the higher-accuracy DeLFT bibliography/citation models. Override
    # GROBID_IMAGE with grobid/grobid:0.9.0-crf for a lightweight CPU setup.
    image: ${GROBID_IMAGE:-grobid/grobid:0.9.0-full}
    init: true
    expose:
      - "8070"
      - "8071"
    networks:
      - backend
    ulimits:
      core:
        soft: 0
        hard: 0
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8070'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

volumes:
  minio-data:
  openalex-cache:
  postgres-data:

networks:
  edge:
  backend:
    internal: true
